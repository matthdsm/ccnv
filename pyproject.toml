[build-system]
requires = ["maturin>=1.8,<2.0"]
build-backend = "maturin"

[project]
name = "ccnv"
version = "1.0.0"
description = "Copy-number analysis for whole-genome sequencing"
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE.md"]
authors = [
    { name = "Matthias De Smet" },
]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "jinja2",
    "jsonschema>=4.20.0",
    "numpy>=2.5,<3",
    "polars>=2,<3",
    "polars-runtime-compat",
    "pyarrow>=26,<27",
    "pyyaml>=6.0",
    "ruptures>=1.1.10",
    "scikit-learn>=1.9,<2",
    "scipy>=1.18,<2",
    "typer>=0.29,<0.30",
]

[project.optional-dependencies]
dev = [
    "pybigwig",
    "pysam",
]

[project.scripts]
ccnv = "ccnv.cli:app"

[tool.maturin]
module-name = "ccnv._core"
python-source = "src"
features = ["pyo3/abi3-py312"]

[tool.pixi.workspace]
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64", "linux-aarch64", "osx-arm64"]

[tool.pixi.dependencies]
numpy = ">=2.5,<3"
polars = ">=2,<3"
polars-runtime-compat = "*"
pyarrow = ">=26,<27"
python = ">=3.12,<4"
scikit-learn = ">=1.9,<2"
scipy = ">=1.18,<2"
typer = ">=0.29,<0.30"
jinja2 = ">=3.1.6,<4"
gcc = ">=16.2.0,<16.3"
pyyaml = ">=6.0"
jsonschema = ">=4.20.0"
rust = "*"
maturin = ">=1.8,<2.0"

[tool.pixi.target.linux.dependencies]
binutils = "*"

[tool.pixi.pypi-dependencies]
ccnv = { path = ".", editable = true }

[tool.pixi.feature.dev.dependencies]
prek = "*"
pybigwig = "*"
pysam = "*"
pytest = "*"
ruff = "*"
samtools = "*"
pip = ">=26.2.1"
python-build = ">=1.5.0,<2"

[tool.pixi.feature.dev.pypi-dependencies]
ccnv = { path = ".", editable = true, extras = ["dev"] }

[tool.pixi.feature.docs.dependencies]
zensical = "*"

[tool.pixi.environments]
default = { features = ["dev"], solve-group = "default" }
prod = { solve-group = "default" }
docs = { features = ["docs"], solve-group = "default" }

[tool.pixi.tasks]
format = "ruff check --fix . && ruff format ."
lint = "ruff check ."
test = "pytest"
hooks = "prek run --all-files"
docker-build = "docker build --platform linux/amd64 -t ghcr.io/matthdsm/ccnv:dev ."
docs-build = "pixi run -e docs zensical build --clean --strict"
docs-serve = "pixi run -e docs zensical serve"
bump-version = "python scripts/bump.py version"
bump-schema = "python scripts/bump.py schema"

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
