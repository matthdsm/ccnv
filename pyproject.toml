[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ccnv"
version = "0.1.0dev"
description = "Copy-number analysis for shallow whole-genome sequencing"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE.md"]
authors = [
    { name = "Center for Medical Genetics Ghent" },
]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "numpy",
    "polars",
    "polars-runtime-compat",
    "pyarrow",
    "pysam",
    "ruptures",
    "scikit-learn",
    "scipy",
    "typer",
]

[project.scripts]
ccnv = "ccnv.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pixi.workspace]
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64", "linux-aarch64", "osx-arm64"]

[tool.pixi.dependencies]
numpy = "*"
polars = "*"
polars-runtime-compat = "*"
pyarrow = "*"
pysam = "*"
python = "3.12.*"
ruptures = "*"
samtools = "*"
scikit-learn = "*"
scipy = "*"
typer = "*"

[tool.pixi.pypi-dependencies]
ccnv = { path = ".", editable = true }

[tool.pixi.feature.dev.dependencies]
prek = "*"
pytest = "*"
ruff = "*"
pip = ">=26.2.1,<27"
python-build = ">=1.5.0,<2"

[tool.pixi.environments]
default = { features = ["dev"], solve-group = "default" }
prod = { solve-group = "default" }

[tool.pixi.tasks]
format = "ruff check --fix . && ruff format ."
lint = "ruff check ."
test = "pytest"
hooks = "prek run --all-files"
docker-build = "docker build --platform linux/amd64 -t quay.io/matthdsm/ccnv:dev ."

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
