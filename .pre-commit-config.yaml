repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: ruff check
        language: system
        types_or: [python, pyi]
        args: [--fix]
      - id: ruff-format
        name: ruff format
        entry: ruff format
        language: system
        types_or: [python, pyi]
      - id: docs-markdown-contracts
        name: docs and API markdown contracts
        entry: pytest -q tests/test_docs_markdown.py
        language: system
        pass_filenames: false
        types_or: [python, pyi, markdown, toml]
